name: Alerts

on:
  push:
    branches: [main]
    paths: ["apps/alerts/**", "deployments/testnet.json", ".github/workflows/alerts.yml"]
  pull_request:
    paths: ["apps/alerts/**", "deployments/testnet.json", ".github/workflows/alerts.yml"]

defaults:
  run:
    working-directory: apps/alerts

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/alerts/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Real testnet events (saved in src/fixtures) and a live contract read.
      - run: npm test
      # Replays the last day of real events for the demo reviewer, without Telegram.
      - name: Dry run over the last day of events
        run: |
          body='{"jsonrpc":"2.0","id":1,"method":"getLatestLedger"}'
          latest=$(curl -s -X POST https://soroban-testnet.stellar.org -H 'content-type: application/json' -d "$body" | jq .result.sequence)
          reviewer=$(jq -r .reviewer ../../deployments/testnet.json)
          node src/main.ts --dry-run --once --from-ledger $((latest - 17000)) --watch "$reviewer"
