name: Alerts

on:
  push:
    branches: [main]
    paths: ["apps/alerts/**", "deployments/testnet.json", ".github/workflows/alerts.yml"]
  pull_request:
    paths: ["apps/alerts/**", "deployments/testnet.json", ".github/workflows/alerts.yml"]

defaults:
  run:
    working-directory: apps/alerts

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/alerts/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Real testnet events (saved in src/fixtures) and a live contract read.
      - run: npm test
      # Replays the last day of real events for the demo reviewer, without Telegram.
      - run: node src/main.ts --dry-run --watch GAS6L6UQUB4PMX2XZTHPM33ITBBQKQEUNOUSNCPMOFJBQHOC4R7G4N2R --from-ledger $(( $(curl -s -X POST https://soroban-testnet.stellar.org -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"getLatestLedger"}' | jq .result.sequence) - 17000 )) --once
