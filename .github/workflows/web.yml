name: Web

on:
  push:
    branches: [main]
    paths: ["apps/web/**", "deployments/testnet.json", ".github/workflows/web.yml"]
  pull_request:
    paths: ["apps/web/**", "deployments/testnet.json", ".github/workflows/web.yml"]

defaults:
  run:
    working-directory: apps/web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run sync-deployment
      - run: npm run lint
      - run: npm run typecheck
      # Reads real Stellar mainnet and testnet; no mocks.
      - run: npm test
      - run: npm run build
      # Every page at phone, tablet and desktop sizes: no sideways scroll,
      # no console errors, tappable header controls.
      - run: npx playwright install --with-deps chromium
      # The full Try it live flow needs the testnet demo keys, and the paid
      # agent check needs the signing key plus a testnet agent holding USDC
      # (each run pays 0.001 testnet USDC). Without these repository secrets
      # those tests are skipped; the layout and unpaid 402 checks still run.
      - run: npm run e2e
        env:
          HABEAS_ISSUER_SECRET: ${{ secrets.HABEAS_ISSUER_SECRET }}
          HABEAS_REVIEWER_SECRET: ${{ secrets.HABEAS_REVIEWER_SECRET }}
          RELAYER_SECRET: ${{ secrets.RELAYER_SECRET }}
          HABEAS_ATTEST_SECRET: ${{ secrets.HABEAS_ATTEST_SECRET }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
